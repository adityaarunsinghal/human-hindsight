name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs all of CI on the tagged commit before it publishes.
  workflow_call:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are SHA-pinned (tag comments for humans): a moved tag cannot
      # silently change what runs against the repo.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The launcher must still parse on Node 18 and refuse it with a short
      # message. Install Node 18 first and record its path; the next setup-node
      # puts the build Node first on PATH.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
      - name: Record the Node 18 binary for the launcher checks
        run: echo "HUMAN_HINDSIGHT_OLDEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-release.mjs
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Smoke tests (processes and tarballs)
        run: npm run test:smoke
      - name: Unit tests stay fast (no real waits, flushes, or child processes)
        # Shared runners are slower than a developer machine, so these limits are loose.
        env:
          HUMAN_HINDSIGHT_UNIT_BUDGET_MS: "120000"
          HUMAN_HINDSIGHT_SLOW_TEST_MS: "2500"
        run: npm run test:budget
      - run: npm run build
      - run: npm run stage:release
      - run: node scripts/pack-release.mjs
      - name: Verify registry-style npx installs without build tools
        run: node scripts/smoke-install.mjs
      - name: Verify interactive workflow handoffs
        run: python3 scripts/smoke-flow.py
      - name: Verify immediate terminal progress and privacy reminders
        run: python3 scripts/smoke-terminal.py
      - name: Verify menu keys and that the terminal is restored
        run: python3 scripts/smoke-menu.py
      - name: Verify Markdown and monochrome GUI in Chrome
        if: runner.os == 'Linux'
        run: node scripts/smoke-gui.mjs

  minimum-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The launcher must still parse on Node 18 and refuse it with a short
      # message. Install Node 18 first and record its path; the next setup-node
      # puts the build Node first on PATH.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
      - name: Record the Node 18 binary for the launcher checks
        run: echo "HUMAN_HINDSIGHT_OLDEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      # Build tools require newer Node than the published CLI.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Pack and install both release candidates
        run: |
          npm run build
          npm run stage:release
          node scripts/pack-release.mjs "$RUNNER_TEMP/packages"
          npm install --prefix "$RUNNER_TEMP/installed" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/packages/"*.tgz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
      - name: Both installed commands refuse Node 18 with the short message and exit 1
        run: node scripts/smoke-node-versions.mjs "$RUNNER_TEMP/installed" "refuse:$(command -v node)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Both installed commands start on the minimum runtime
        run: node scripts/smoke-node-versions.mjs "$RUNNER_TEMP/installed" "start:$(command -v node)"
      - name: Exercise the published CLI surface on the minimum runtime
        run: node scripts/smoke-runtime.mjs "$RUNNER_TEMP/installed"

  opencode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ["opencode-ai@1.19.4", "@opencode/cli@2.1.3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install a pinned OpenCode CLI in a temporary prefix
        run: npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund "${{ matrix.package }}"
      - name: Exercise the runner against a local mock provider
        run: node scripts/smoke-opencode.mjs "$RUNNER_TEMP/opencode/node_modules/.bin/opencode"
