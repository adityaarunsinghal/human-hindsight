name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are SHA-pinned (tag comments for humans): a moved tag cannot
      # silently change what runs against the repo.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-release.mjs
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      # Package hygiene: the tarball must contain dist + the standard metadata
      # files and NOTHING else (no src/, test/, fixtures, or config).
      # --ignore-scripts skips a redundant `prepare` rebuild where npm honors it
      # (npm 11+; npm 10 runs prepare during pack regardless), so the check
      # inspects the dist/ the build step above just produced. JSON-capture
      # safety does NOT depend on it: `prepare` routes its stdout to stderr
      # precisely so a mid-pack build can never corrupt this file.
      - run: npm pack --dry-run --json --ignore-scripts > pack.json
      - run: node scripts/check-pack.mjs pack.json
      - run: npm pack ./compat/cc-hindsight --dry-run --json --ignore-scripts > pack-compat.json
      - run: node scripts/check-pack.mjs pack-compat.json --compat

  minimum-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Build tools require newer Node than the published CLI.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Pack and install both release candidates
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packages"
          npm pack ./compat/cc-hindsight --ignore-scripts --pack-destination "$RUNNER_TEMP/packages"
          npm install --prefix "$RUNNER_TEMP/installed" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/packages/"*.tgz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Exercise the published CLI surface on the minimum runtime
        run: node scripts/smoke-runtime.mjs "$RUNNER_TEMP/installed"

  opencode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ["opencode-ai@1.19.4", "@opencode/cli@2.1.3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install a pinned OpenCode CLI in a temporary prefix
        run: npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund "${{ matrix.package }}"
      - name: Exercise the runner against a local mock provider
        run: node scripts/smoke-opencode.mjs "$RUNNER_TEMP/opencode/node_modules/.bin/opencode"
