name: Release

# Publishes to npm and creates a GitHub release when a version tag is pushed.
# Uses npm Trusted Publishing via OIDC: no long-lived NPM_TOKEN is stored in the
# repo, and every release carries a verified provenance attestation linking the
# package back to this workflow run and commit.
#
# ONE-TIME SETUP (npmjs.com, after the first manual publish): package Settings →
# Trusted Publisher → add this repo + workflow `release.yml`. Until that trust is
# configured, this workflow fails safe (it cannot publish without it).
#
# This never retro-fires on tags that predate the workflow; it runs only for
# tags pushed after it lands on the default branch.

on:
  push:
    tags:
      - "v*"

# Least privilege. id-token: write is what lets npm verify this run over OIDC;
# contents: write creates the GitHub release after npm publishing succeeds.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to match .github/workflows/ci.yml (bump the SHA and the tag
      # comment together): a moved tag cannot silently change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 ships npm >= 11.5, which supports OIDC Trusted Publishing
          # out of the box (no global npm upgrade, which previously broke
          # `npm ci` against this repo's npm-shrinkwrap.json).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Guard: the tag must match the version being published, so a stray
      # `git tag v9.9.9` can never publish whatever happens to be in package.json.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing v$PKG"

      # prepublishOnly runs lint + typecheck + tests + build + the pack-contents
      # assertion before this succeeds, so a broken or stale build cannot ship.
      - run: npm publish --provenance --access public

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = `## [${version}]`;
          const start = changelog.indexOf(heading);
          if (start < 0) throw new Error(`Missing changelog section for ${version}`);
          const body = changelog.slice(changelog.indexOf("\n", start) + 1);
          const end = body.indexOf("\n## ");
          const notes = (end < 0 ? body : body.slice(0, end)).trim();
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "release-notes.md"), `${notes}\n`);
          NODE
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
