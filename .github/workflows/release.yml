name: Release

# Publishes to npm and creates a GitHub release when a version tag is pushed.
# Uses npm Trusted Publishing via OIDC: no long-lived NPM_TOKEN is stored in the
# repo, and every release carries a verified provenance attestation linking the
# package back to this workflow run and commit.
#
# Configure a trusted publisher for EACH package (human-hindsight and the
# cc-hindsight wrapper), using this repo + workflow `release.yml`, with direct
# `npm publish` allowed. New npm namespaces need a one-time authenticated
# bootstrap before their package settings are available.
#
# This never retro-fires on tags that predate the workflow; it runs only for
# tags pushed after it lands on the default branch.

on:
  push:
    tags:
      - "v*"

# Least privilege. id-token: write is what lets npm verify this run over OIDC;
# contents: write creates the GitHub release after npm publishing succeeds.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to match .github/workflows/ci.yml (bump the SHA and the tag
      # comment together): a moved tag cannot silently change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 ships npm >= 11.5, which supports OIDC Trusted Publishing
          # out of the box (no global npm upgrade, which previously broke
          # `npm ci` against this repo's npm-shrinkwrap.json).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify package identities and release versions
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      # Published manifests contain no scripts or dependencies. Validate the
      # workspace and actual staged tarballs explicitly before publication.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run stage:release
      - run: node scripts/pack-release.mjs
      - run: node scripts/smoke-install.mjs

      - name: Publish Human Hindsight
        run: node scripts/publish-package.mjs .release/human-hindsight

      # Publish the wrapper only after its exact dependency is available. A
      # rerun skips versions already published from this commit.
      - name: Publish deprecated cc-hindsight wrapper
        run: node scripts/publish-package.mjs .release/cc-hindsight

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = `## [${version}]`;
          const start = changelog.indexOf(heading);
          if (start < 0) throw new Error(`Missing changelog section for ${version}`);
          const body = changelog.slice(changelog.indexOf("\n", start) + 1);
          const end = body.indexOf("\n## ");
          const notes = (end < 0 ? body : body.slice(0, end)).trim();
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "release-notes.md"), `${notes}\n`);
          NODE
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
