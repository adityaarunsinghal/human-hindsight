name: Release

# Publishes to npm and creates a GitHub release when a version tag is pushed.
# Uses npm Trusted Publishing via OIDC: no long-lived NPM_TOKEN is stored in the
# repo, and every release carries a verified provenance attestation linking the
# package back to this workflow run and commit.
#
# Configure a trusted publisher for EACH package (human-hindsight and the
# cc-hindsight wrapper), using this repo + workflow `release.yml`, with direct
# `npm publish` allowed. New npm namespaces need a one-time authenticated
# bootstrap before their package settings are available.
#
# This never retro-fires on tags that predate the workflow; it runs only for
# tags pushed after it lands on the default branch.

on:
  push:
    tags:
      - "v*"

# Least privilege: read-only by default. Only the publishing job can mint the
# OIDC token npm verifies (id-token: write) and create the GitHub release
# (contents: write), and it starts only after every check below has passed.
permissions:
  contents: read

jobs:
  # All of CI, on the tagged commit itself: a tag on a commit that CI never ran
  # on, or one whose checks failed, publishes nothing.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # SHA-pinned to match .github/workflows/ci.yml (bump the SHA and the tag
      # comment together): a moved tag cannot silently change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The packaging checks need Node 18: the launcher must still parse there
      # and refuse it with a short message. Install Node 18 first and record
      # its path; the next setup-node puts the build Node first on PATH.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
      - name: Record the Node 18 binary for the launcher checks
        run: echo "HUMAN_HINDSIGHT_OLDEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Verify package identities and release versions
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      # The same checks as CI, in this job, on the packages it publishes.
      # Published manifests contain no scripts or dependencies, so nothing runs
      # at install time; everything is validated here first.
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Smoke tests (processes and tarballs)
        run: npm run test:smoke
      - run: npm run build
      - run: npm run stage:release
      - run: node scripts/pack-release.mjs
      - name: Verify registry-style npx installs without build tools
        run: node scripts/smoke-install.mjs
      - name: Verify interactive workflow handoffs
        run: python3 scripts/smoke-flow.py
      - name: Verify immediate terminal progress and privacy reminders
        run: python3 scripts/smoke-terminal.py
      - name: Verify menu keys and that the terminal is restored
        run: python3 scripts/smoke-menu.py
      - name: Verify Markdown and monochrome GUI in Chrome
        run: node scripts/smoke-gui.mjs

      # The runtime promise, on the exact tarballs above: Node 18 is refused
      # with the short message, and both commands start on Node 22.13.0.
      - name: Install both packed release candidates
        run: npm install --prefix "$RUNNER_TEMP/installed" --ignore-scripts --no-audit --no-fund .release/packages/*.tgz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
      - name: Both installed commands refuse Node 18 with the short message and exit 1
        run: node scripts/smoke-node-versions.mjs "$RUNNER_TEMP/installed" "refuse:$(command -v node)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Both installed commands start on the minimum runtime
        run: node scripts/smoke-node-versions.mjs "$RUNNER_TEMP/installed" "start:$(command -v node)"
      - name: Exercise the published CLI surface on the minimum runtime
        run: node scripts/smoke-runtime.mjs "$RUNNER_TEMP/installed"

      # Back to the build Node for publishing. Node 24 ships npm >= 11.5, which
      # supports OIDC Trusted Publishing out of the box (no global npm upgrade,
      # which previously broke `npm ci` against this repo's npm-shrinkwrap.json).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Publish Human Hindsight
        run: node scripts/publish-package.mjs .release/human-hindsight

      # Publish the wrapper only after its exact dependency is available. A
      # rerun skips versions already published from this commit.
      - name: Publish deprecated cc-hindsight wrapper
        run: node scripts/publish-package.mjs .release/cc-hindsight

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = `## [${version}]`;
          const start = changelog.indexOf(heading);
          if (start < 0) throw new Error(`Missing changelog section for ${version}`);
          const body = changelog.slice(changelog.indexOf("\n", start) + 1);
          const end = body.indexOf("\n## ");
          const notes = (end < 0 ? body : body.slice(0, end)).trim();
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "release-notes.md"), `${notes}\n`);
          NODE
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
