name: Extraction fidelity report
description: The exporter dropped genuine human input, or admitted machine text.
labels: ["extraction-fidelity"]
body:
  - type: markdown
    attributes:
      value: |
        If your export dropped something you typed or included text the coding
        tool added, run `npx human-hindsight export --verbose`. The log names
        the rule that dropped each piece of text. Replace personal details
        with invented text before sharing a snippet.
  - type: input
    id: version
    attributes:
      label: Human Hindsight version + agent CLI version
      description: Run `npx human-hindsight --version` and include the name and version of the coding tool that saved the session, if known.
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Which direction is the failure?
      options:
        - Human input was dropped (missing from export)
        - Machine text was admitted (should have been dropped)
        - Something else (dedupe, ordering, markers)
    validations:
      required: true
  - type: textarea
    id: verbose-log
    attributes:
      label: Relevant lines from the export log
      description: The drop log lines for the affected session (scrub anything sensitive).
  - type: textarea
    id: fixture
    attributes:
      label: Synthetic fixture reproducing the shape
      description: |
        The JSONL entry (or minimal sequence) with every real string replaced by
        a placeholder. Keep the field names, nesting, types and order intact.
        See [Add a source](https://github.com/adityaarunsinghal/human-hindsight/blob/main/CONTRIBUTING.md#add-a-source)
        for the steps used to turn your example into a regression test.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the export contain?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm the fixture above is synthetic, with no real prompts, paths, names, or keys.
          required: true
